<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINELA | Portal de Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--cyan:#00e5ff;--gold:#ffb703;--text:#e2f1ff;--muted:#7f9bb8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(circle at 50% 35%,#06152d 0%,#020813 55%,#000 100%);font-family:'Rajdhani',sans-serif;color:var(--text);min-height:100vh}
.main{max-width:480px;margin:0 auto;padding:20px}
.hero{text-align:center;margin:20px 0}
.sentinela-3d{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(2.5rem,9vw,4rem);letter-spacing:.15em;text-shadow:0 0 25px rgba(0,229,255,.7)}
.badge{display:inline-block;margin-top:8px;padding:5px 14px;font-size:.8rem;letter-spacing:.3em;color:var(--cyan);border:1px solid rgba(0,229,255,.3);border-radius:4px}
.auth-panel{background:rgba(3,12,28,.85);border:1px solid rgba(0,229,255,.35);border-top:2px solid var(--cyan);border-radius:12px;padding:20px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;background:#000;padding:5px;border-radius:8px;margin-bottom:15px}
.tab-btn{background:transparent;border:none;color:var(--muted);font-weight:700;padding:10px 2px;border-radius:6px;cursor:pointer;font-size:.8rem}
.tab-btn.active{background:#0b2b59;color:var(--cyan);border:1px solid rgba(0,229,255,.4)}
.tab-btn.owner-tab.active{background:#3d2800;color:var(--gold);border-color:var(--gold)}
label{display:block;font-size:.85rem;font-weight:600;text-transform:uppercase;margin:12px 0 5px}
input{width:100%;padding:12px;background:#010610;border:1px solid rgba(0,229,255,.25);border-radius:6px;color:#fff;font-size:1rem}
input:focus{outline:none;border-color:var(--cyan)}
.btn{width:100%;padding:14px;border:none;border-radius:6px;font-family:'Orbitron',sans-serif;font-weight:700;cursor:pointer;margin-top:15px}
.btn-blue{background:linear-gradient(90deg,#005bb5,#00a8e8);color:#fff}
.btn-gold{background:linear-gradient(90deg,#b87a00,#ffb703);color:#000}
.hidden{display:none!important}
.status{margin-top:12px;padding:10px;border-radius:6px;font-weight:600;display:none}
.status.error{display:block;background:rgba(255,59,92,.15);border:1px solid #ff3b5c;color:#ff8fa3}
.status.success{display:block;background:rgba(0,230,118,.15);border:1px solid #00e676;color:#80f5b8}
.link{background:none;border:none;color:var(--cyan);cursor:pointer;margin-top:10px}
.result{text-align:left;background:#0a1a2e;border-radius:10px;padding:14px;margin-top:15px;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="main">
<header class="hero"><h1 class="sentinela-3d">SENTINELA</h1><div><span class="badge">NÚCLEO DE SEGURIDAD & CONTROL</span></div></header>
<section class="auth-panel" id="auth-container">
<div class="tabs">
<button type="button" class="tab-btn active" onclick="showTab('login',this)">Iniciar Sesión</button>
<button type="button" class="tab-btn owner-tab" onclick="showTab('owner',this)">Cuenta Dueño</button>
<button type="button" class="tab-btn" onclick="showTab('user',this)">Nuevo Usuario</button>
</div>

<form id="form-login" onsubmit="return doLogin(event)">
<p><b>Acceso al Sistema</b></p><p style="color:var(--muted)">Ingresá tus credenciales para desbloquear la terminal.</p>
<label>Correo Electrónico</label><input id="login-email" type="email" placeholder="operador@dominio.com" required>
<label>Contraseña</label><input id="login-password" type="password" placeholder="••••••••" required>
<button class="btn btn-blue" type="submit">Entrar a Sentinela</button>
<div id="login-status" class="status"></div>
</form>

<form id="form-owner" class="hidden" onsubmit="return doRegisterOwner(event)">
<p style="color:var(--gold)"><b>Registro Maestro (Dueño)</b></p>
<label>Nombre del Dueño</label><input id="owner-name" placeholder="Nombre completo" required>
<label>Correo Maestro</label><input id="owner-email" type="email" placeholder="admin@dominio.com" required>
<label>Contraseña Maestra (mín. 8)</label><input id="owner-password" type="password" minlength="8" required>
<button class="btn btn-gold" type="submit">Registrar Dueño</button>
<div id="owner-status" class="status"></div>
</form>

<form id="form-user" class="hidden" onsubmit="return doRegisterUser(event)">
<p><b>Registro de Usuario</b></p>
<label>Nombre de Usuario</label><input id="user-name" placeholder="Tu nombre" required>
<label>Correo</label><input id="user-email" type="email" placeholder="usuario@correo.com" required>
<label>Contraseña (mín. 6)</label><input id="user-password" type="password" minlength="6" required>
<button class="btn btn-blue" type="submit">Crear Cuenta</button>
<div id="user-status" class="status"></div>
</form>
</section>
<section class="auth-panel hidden" id="main-app">
<h2 id="welcome">Bienvenido 👋</h2>
<p id="role-pill" style="color:var(--cyan)">ROL: USUARIO</p>
<p style="text-align:left;margin-top:15px">🔗 Pegá el link a revisar</p>
<input id="urlInput" placeholder="https://ejemplo.com/oferta...">
<button class="btn btn-blue" onclick="escanear()">🔍 ESCANEAR AHORA</button>
<div id="resultado"></div>
<button class="btn" style="background:#ff3b5c;color:#fff" onclick="salir()">SALIR</button>
</section>
</div>
<script>
function showTab(t,btn){
document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
['form-login','form-owner','form-user'].forEach(id=>document.getElementById(id).classList.add('hidden'));
if(t==='login')document.getElementById('form-login').classList.remove('hidden');
if(t==='owner')document.getElementById('form-owner').classList.remove('hidden');
if(t==='user')document.getElementById('form-user').classList.remove('hidden');
}
function saveUser(email,name,role){
var users=JSON.parse(localStorage.getItem('sentinela_users')||'[]');
users.push({email:email,name:name,role:role});
localStorage.setItem('sentinela_users',JSON.stringify(users));
localStorage.setItem('sentinela_session',JSON.stringify({email:email,name:name,role:role}));
}
function doLogin(e){e.preventDefault();
var email=document.getElementById('login-email').value;
var users=JSON.parse(localStorage.getItem('sentinela_users')||'[]');
var f=users.find(u=>u.email===email);
var st=document.getElementById('login-status');
if(!f){st.className='status error';st.innerText='No existe esa cuenta. Registrate primero en Nuevo Usuario o Dueño.';return false;}
localStorage.setItem('sentinela_session',JSON.stringify(f));
mostrarApp(f);return false;}
function doRegisterOwner(e){e.preventDefault();
var n=document.getElementById('owner-name').value;var em=document.getElementById('owner-email').value;
saveUser(em,n,'DUEÑO');
document.getElementById('owner-status').className='status success';
document.getElementById('owner-status').innerText='¡Dueño registrado! Ahora andá a Iniciar Sesión.';
return false;}
function doRegisterUser(e){e.preventDefault();
var n=document.getElementById('user-name').value;var em=document.getElementById('user-email').value;
saveUser(em,n,'USUARIO');
document.getElementById('user-status').className='status success';
document.getElementById('user-status').innerText='¡Usuario creado! Ahora andá a Iniciar Sesión.';
return false;}
function mostrarApp(u){
document.getElementById('auth-container').classList.add('hidden');
document.getElementById('main-app').classList.remove('hidden');
document.getElementById('welcome').innerText='Bienvenido '+u.name+' 👋';
document.getElementById('role-pill').innerText='ROL: '+u.role;
document.getElementById('role-pill').style.color=u.role==='DUEÑO'?'#ffb703':'#00e5ff';
}
function salir(){localStorage.removeItem('sentinela_session');location.reload();}
function escanear(){
var url=document.getElementById('urlInput').value.trim();
if(!url){alert('Pegá un link');return;}
if(!url.startsWith('http'))url='https://'+url;
var pts=100;var checks=[];
if(url.startsWith('https://'))checks.push('✅ Usa HTTPS');
else{pts-=30;checks.push('❌ NO usa HTTPS');}
var bajo=url.toLowerCase();
var malas=['gratis','premio','urgente','banco','login','oferta','regalo','crypto','bitcoin'];
var enc=malas.filter(w=>bajo.includes(w));
if(enc.length){pts-=20*enc.length;checks.push('⚠️ Palabras sospechosas: '+enc.join(', '));}
if(url.length>80){pts-=15;checks.push('⚠️ URL muy larga');}
if(/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/.test(url)){pts-=30;checks.push('❌ Usa IP, muy sospechoso');}
if(pts<0)pts=0;
var nivel=pts>=80?'SEGURO ✅':pts>=50?'DUDOSO ⚠️':'PELIGROSO ⛔';
var color=pts>=80?'#00e676':pts>=50?'#ffcc00':'#ff3b5c';
document.getElementById('resultado').innerHTML='<div class="result"><b>'+url+'</b><br><br><b style="color:'+color+'">'+nivel+' - '+pts+'/100</b><br>'+checks.join('<br>')+'<br><br><button class="btn" style="background:#222;color:#fff;border:1px solid #444" onclick="navigator.clipboard.writeText(\'🛡️ CENTINELA: '+nivel+' '+pts+'/100 - '+url+'\').then(()=>alert(\'Copiado\'))">📋 COPIAR INFORME</button></div>';
}
var ses=localStorage.getItem('sentinela_session');
if(ses){mostrarApp(JSON.parse(ses));}
</script>
</body>
</html>
<!-- MEJORA 1: RELAMPAGOS LIVIANOS -->
<canvas id="rayos" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:.6"></canvas>
<style>
#rayos{position:fixed;top:0;left:0}
.sentinela-3d{transition:transform .2s}
</style>
<script>
// --- TILT 3D CON EL DEDO / MOUSE, sin Three.js ---
var titulo=document.querySelector('.sentinela-3d');
if(titulo){
  document.addEventListener('mousemove',function(e){
    var x=(e.clientX/window.innerWidth-.5)*12;
    var y=(e.clientY/window.innerHeight-.5)*10;
    titulo.style.transform='perspective(800px) rotateY('+x+'deg) rotateX('+(-y)+'deg)';
  });
}
// --- RAYOS LIVIANOS, 1 cada 4 segundos ---
var c=document.getElementById('rayos');var ctx=c.getContext('2d');
function resize(){c.width=window.innerWidth;c.height=window.innerHeight;} resize();window.addEventListener('resize',resize);
function rayo(){
  ctx.clearRect(0,0,c.width,c.height);
  var x=Math.random()*c.width;var y=0;
  ctx.strokeStyle='rgba(0,229,255,0.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);
  while(y<c.height*0.5){y+=30+Math.random()*40;x+= (Math.random()-0.5)*60;ctx.lineTo(x,y);}
  ctx.stroke();
  // flash
  document.body.style.background='#0a2a4a';
  setTimeout(function(){document.body.style.background='';ctx.clearRect(0,0,c.width,c.height);},120);
}
setInterval(rayo,4000); // cada 4 seg, no todo el tiempo = no se traba
</script>
<div style="text-align:center;margin:15px 0;color:#7f9bb8;font-size:.85rem">— O CONTINUÁ CON —</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<button type="button" onclick="loginSocial('Google')" style="padding:12px;background:#fff;color:#000;border:none;border-radius:6px;font-weight:700;cursor:pointer">🔴 Google</button>
<button type="button" onclick="loginSocial('Apple')" style="padding:12px;background:#000;color:#fff;border:1px solid #fff;border-radius:6px;font-weight:700;cursor:pointer">🍎 Apple</button>
</div>
<script>
function loginSocial(proveedor){
  var nombre=prompt('Entraste con '+proveedor+'\n¿Tu nombre?');
  if(!nombre) return;
  var email=prompt('¿Tu mail de '+proveedor+'?');
  if(!email) return;
  var user={email:email,name:nombre,role:'USUARIO'};
  var users=JSON.parse(localStorage.getItem('sentinela_users')||'[]');
  if(!users.find(u=>u.email===email)) users.push(user);
  localStorage.setItem('sentinela_users',JSON.stringify(users));
  localStorage.setItem('sentinela_session',JSON.stringify(user));
  alert('¡Bienvenido con '+proveedor+'!');
  mostrarApp(user);
}
</script>
