<!DOCTYPE html>
<html lang="es">
<head>

  <title>CENTINELA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      min-height: 100vh;
      background-color: #061021;
      color: #f1f5f9;
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(circle at 50% 18%, #16376e 0%, #091833 46%, #030812 100%);
      position: relative;
    }

    .grid-bg {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        linear-gradient(to right, rgba(120, 165, 230, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(120, 165, 230, 0.05) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none;
      z-index: 0;
    }

    .vignette-bg {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.72) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .view {
      display: none;
      position: relative;
      z-index: 2;
    }

    .view.active {
      display: block;
    }
