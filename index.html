<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CENTINELA REAL</title>
<style>body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:20px}input{padding:12px;margin:8px;width:80%;max-width:300px;border-radius:8px;border:none}button{padding:12px 25px;background:#00ff88;border:none;border-radius:8px;font-weight:bold}.box{background:#1a1a1a;padding:20px;border-radius:15px;max-width:400px;margin:auto}</style>
</head>
<body>
<h1>🛡️ CENTINELA REAL</h1>
<div class="box" id="login">
<h2>INICIAR SESIÓN REAL</h2>
<input id="u" placeholder="Usuario"><br>
<input id="p" type="password" placeholder="Contraseña"><br>
<button onclick="login()">ENTRAR</button>
<p id="msg"></p>
</div>
<div class="box" id="app" style="display:none">
<h2 id="bienvenida"></h2>
<p>✅ Conectado a la nube real</p>
<p>Nivel: <b id="nivel">1</b></p>
<button onclick="salir()">SALIR</button>
</div>
<script>
const SUPABASE_URL = "PEGA_ACA_TU_URL";
const SUPABASE_KEY = "PEGA_ACA_TU_KEY";
async function login(){
  const u=document.getElementById('u').value.trim();
  const p=document.getElementById('p').value.trim();
  if(!u||!p){document.getElementById('msg').innerText="Falta usuario o contraseña, JEFE";return;}
  document.getElementById('msg').innerText="Conectando a la nube real...";
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/centinela_usuarios?usuario=eq."+u+"&password=eq."+p, {headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});
    const d=await r.json();
    if(d && d.length>0){
      localStorage.setItem('centinela_user',u);
      document.getElementById('login').style.display='none';
      document.getElementById('app').style.display='block';
      document.getElementById('bienvenida').innerText="Bienvenido, "+u;
      document.getElementById('nivel').innerText=d[0].nivel||1;
    }else{document.getElementById('msg').innerText="Usuario o contraseña incorrectos, JEFE";}
  }catch(e){document.getElementById('msg').innerText="Error, JEFE: "+e.message;}
}
function salir(){localStorage.removeItem('centinela_user');location.reload();}
</script>
</body>
</html>
