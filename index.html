<script>
(function(){
var lab=document.getElementById('pC');if(!lab)return;
var caja=document.createElement('div');caja.className='c';
caja.innerHTML='<b>💻 LAB QUE CREA CÓDIGO REAL</b><p style="font-size:13px;color:#d8b4fe">Escribí qué querés y te lo creo de verdad, guardado en tu Lab.</p>';
var inp=document.createElement('input');inp.id='codeQue';inp.placeholder='Ej: boton rojo, portada violeta, tabla, cartel...';
var out=document.createElement('div');out.id='codeOut';out.style.cssText='background:#16002b;border:1px solid #a100f2;border-radius:12px;padding:10px;margin-top:8px;white-space:pre-wrap;font-size:12px;display:none';
var btn=document.createElement('button');btn.className='btn';btn.textContent='💻 CREAR CÓDIGO REAL Y GUARDAR EN LAB';btn.onclick=function(){
var q=(document.getElementById('codeQue').value||'boton').toLowerCase();var code='';
if(q.indexOf('boton')>-1)code='<button style="background:#a100f2;color:#fff;padding:16px;border:0;border-radius:16px;font-weight:900;width:100%">🛡️ '+document.getElementById('codeQue').value+' - ALFA BRAVO 10-4</button>';
else if(q.indexOf('portada')>-1)code='<div style="background:linear-gradient(135deg,#a100f2,#6d28d9,#1a0033);padding:20px;border-radius:24px;text-align:center;color:#fff"><h1>SENTINELA</h1><p>ALFA BRAVO 10-4 • VIOLETA REAL</p></div>';
else if(q.indexOf('tabla')>-1)code='<table border="1" style="width:100%;color:#fff"><tr><td>Fecha</td><td>Nivel</td><td>Qué pasó</td></tr><tr><td>'+new Date().toLocaleDateString()+'</td><td>🟢 VERDE</td><td>'+document.getElementById('codeQue').value+'</td></tr></table>';
else if(q.indexOf('cartel')>-1||q.indexOf('alerta')>-1)code='<div style="background:#dc2626;color:#fff;padding:16px;border-radius:16px;text-align:center;font-weight:900">🚨 '+document.getElementById('codeQue').value+' - ALFA BRAVO 10-4</div>';
else if(q.indexOf('reloj')>-1)code='<div id="reloj"></div><script>setInterval(function(){document.getElementById("reloj").textContent=new Date().toLocaleTimeString()},1000)<\/script>';
else code='<!-- SENTINELA REAL - ALFA BRAVO 10-4 -->\n<div style="background:#2a0a4a;color:#fff;padding:16px;border-radius:16px">\n<h2>'+document.getElementById('codeQue').value+'</h2>\n<p>Creado en Lab Real - '+new Date().toLocaleString()+'</p>\n</div>';
out.style.display='block';out.textContent=code;
try{datos.unshift({que:'Código real creado: '+document.getElementById('codeQue').value+' | '+code.slice(0,120),nivel:'🔵 AZUL - Experimento',lugar:'Lab real - Código',tipo:'Código real',hora:new Date().toLocaleTimeString(),fecha:new Date().toLocaleDateString(),likes:0,coms:[]});save();render()}catch(e){}
var b2=document.createElement('button');b2.className='btn btn2';b2.style.marginTop='8px';b2.textContent='📋 COPIAR CÓDIGO REAL';b2.onclick=function(){navigator.clipboard.writeText(code).then(function(){alert('Código real copiado ✅')})};out.appendChild(document.createElement('br'));out.appendChild(b2);
var b3=document.createElement('button');b3.className='btn gris';b3.style.marginTop='8px';b3.textContent='📥 DESCARGAR CÓDIGO REAL .html';b3.onclick=function(){var blob=new Blob([code],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='codigo-sentinela-real.html';a.click()};out.appendChild(b3);
};
caja.appendChild(inp);caja.appendChild(btn);caja.appendChild(out);lab.appendChild(caja);
})();
</script>
