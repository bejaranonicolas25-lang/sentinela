<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centinela</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:#000; overflow:hidden; }
  canvas{ border:none !important; outline:none !important; display:block; width:100vw; height:100vh; }
</style>
</head>
<body>
<canvas id="canvasMP4"></canvas>

<script src="canvas.js"></script>
<script>
// VOZ HUMANA - CERO MÁQUINA
function hablar(texto){
  speechSynthesis.cancel();
  const voz = new SpeechSynthesisUtterance(texto);
  voz.lang = "es-AR";
  voz.rate = 1.1;
  voz.pitch = 1.1;
  voz.volume = 2.0;
 // VOCES GRITANDO DE FONDO
function gritarFondo(){
  const frases = ["¡Agárralo!", "¡Ahí está!", "¡No lo dejes ir!"];
  frases.forEach((f, i) => {
    setTimeout(() => {
      const v = new SpeechSynthesisUtterance(f);
      v.lang = "es-AR"; v.rate = 1.3; v.pitch = 1.5; v.volume = 0.6;
      speechSynthesis.speak(v);
    }, i * 400);
  });
}
setInterval(gritarFondo, 5000);
  const voces = speechSynthesis.getVoices();
  const humana = voces.find(v => v.lang.includes("es") && v.name.toLowerCase().includes("google")) || voces.find(v => v.lang.includes("es"));
  if(humana) voz.voice = humana;
  speechSynthesis.speak(voz);
}

// CÓDIGO UNIVERSAL - CORRIGE ERRORES
window.addEventListener('error', e => e.preventDefault());
window.addEventListener('resize', () => {
  const c = document.getElementById("canvasMP4");
  if(c){ c.width = window.innerWidth; c.height = window.innerHeight; }
});
document.querySelectorAll("img").forEach(img => {
  img.onerror = () => { img.style.display = "none"; };
});
</script>
</body>
</html>
