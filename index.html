<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CENTINELA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#040d21;color:#fff;text-align:center;padding:16px;overflow-x:hidden}
h1{font-size:42px;letter-spacing:5px;margin-top:8px}
.sub{color:#94a3b8;font-size:13px;margin-bottom:8px}

/* HUMANOIDE EN CODIGO */
.hum{width:260px;height:360px;margin:0 auto;position:relative;animation:flota 3s ease-in-out infinite}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* CABEZA HUMANOIDE */
.cabeza{width:92px;height:105px;margin:0 auto;background:linear-gradient(180deg,#dbeafe,#93c5fd 40%,#1e3a8a);border:2px solid #bfdbfe;border-radius:48% 48% 42% 42%;position:relative;z-index:3;box-shadow:0 10px 25px rgba(0,0,0,.6),inset 0 -12px 20px rgba(0,0,0,.25)}
.cabeza:before{content:"";position:absolute;top:-10px;left:32px;width:26px;height:12px;background:#60a5fa;border-radius:10px}
.ojo{position:absolute;top:42px;width:16px;height:9px;background:#020617;border-radius:20px;box-shadow:0 0 12px #38bdf8,0 0 4px #38bdf8 inset}
.ojo:after{content:"";position:absolute;left:5px;top:2px;width:6px;height:5px;background:#38bdf8;border-radius:50%}
.boca{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:28px;height:5px;background:#0f172a;border-radius:10px}

/* CUELLO Y TORSO */
.cuello{width:26px;height:14px;background:#1e3a8a;margin:-2px auto 0}
.torso{width:132px;height:132px;margin:0 auto;background:linear-gradient(180deg,#1d4ed8,#0a1a3a);border:2px solid #60a5fa;border-radius:28px 28px 18px 18px;position:relative;z-index:2;box-shadow:inset 0 10px 18px rgba(255,255,255,.2)}
.pecho{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:56px;height:56px;background:radial-gradient(circle,#67e8f9,#0ea5e9 60%,#020617);border:2px solid #a5f3fc;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;animation:late 1.8s infinite}
@keyframes late{0%,100%{box-shadow:0 0 10px #38bdf8}50%{box-shadow:0 0 28px #38bdf8}}
.pecho span{font-size:10px;font-weight:900;color:#fff;text-shadow:0 0 6px #000}

/* BRAZOS SOSTENIENDO CARTEL */
.brazo{position:absolute;top:145px;width:30px;height:95px;background:linear-gradient(180deg,#3b82f6,#071530);border:2px solid #93c5fd;border-radius:20px;z-index:1}
.brazo.izq{left:38px;transform:rotate(18deg)}
.brazo.der{right:38px;transform:rotate(-18deg)}
.mano{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:34px;height:34px;background:#dbeafe;border:2px solid #60a5fa;border-radius:50%}

/* PIERNAS */
.pierna{position:absolute;bottom:0;width:38px;height:58px;background:linear-gradient(180deg,#1e3a8a,#020617);border:2px solid #60a5fa;border-radius:10px 10px 16px 16px}
.pierna.izq{left:72px}.pierna.der{right:72px}

/* CARTEL QUE SOSTIENE */
.cartel{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:230px;background:#020617;border:2px solid #38bdf8;border-radius:12px;padding:10px 8px;z-index:4;box-shadow:0 0 20px rgba(56,189,248,.6)}
.cartel b{font-size:20px;letter-spacing:4px;color:#fff}
.cartel small{display:block;color:#38bdf8;font-size:10px;letter-spacing:2px;margin-top:2px}

/* LOGIN */
.card{background:#0a1a3a;border:1px solid #38bdf8;border-radius:16px;padding:18px;max-width:420px;margin:14px auto}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #1e3a8a;background:#01040a;color:#fff;margin-top:10px}
button{width:100%;padding:13px;border:none;border-radius:10px;font-weight:800;margin-top:12px;cursor:pointer}
.blue{background:#2563eb;color:#fff}
.dark{background:#020817;color:#fff;border:1px solid #1e3a8a}
#adentro{display:none}
</style>
</head>
<body>

<h1>CENTINELA</h1>
<p class="sub">Nico Bejarano • ALFA BRAVO 10-4</p>

<!-- HUMANOIDE EN CODIGO SOSTENIENDO CENTINELA -->
<div class="hum">
  <div class="cabeza">
    <div class="ojo" style="left:18px"></div>
    <div class="ojo" style="right:18px"></div>
    <div class="boca"></div>
  </div>
  <div class="cuello"></div>
  <div class="torso"><div class="pecho"><span>🛡️</span></div></div>
  <div class="brazo izq"><div class="mano"></div></div>
  <div class="brazo der"><div class="mano"></div></div>
  <div class="pierna izq"></div>
  <div class="pierna der"></div>
  <div class="cartel"><b>CENTINELA</b><small>ALFA BRAVO 10-4 • NICO BEJARANO</small></div>
</div>

<div id="login" class="card">
<h2>Bienvenido a CENTINELA</h2>
<input value="Nico Bejarano">
<input value="NICO-10-4-SENTINELA">
<button class="blue" onclick="document.getElementById('login').style.display='none';document.getElementById('adentro').style.display='block'">Iniciar sesión - TOCAME</button>
<button class="dark" onclick="alert('Clave: NICO-10-4-SENTINELA')">¿Olvidaste tu contraseña?</button>
</div>

<div id="adentro" class="card">
<h2>🛡️ YA ENTRASTE ✅</h2>
<p id="clima" style="margin:12px 0">Cargando...</p>
<button class="blue" onclick="hablar()">▶️ ESCUCHAR: CENTINELA ACTIVO</button>
<button class="dark" onclick="location.reload()">Salir</button>
</div>

<script>
function hablar(){try{var u=new SpeechSynthesisUtterance('Alfa Bravo diez cuatro, Centinela activo, Nico Bejarano');u.lang='es-AR';speechSynthesis.speak(u);}catch(e){}}
fetch('https://api.open-meteo.com/v1/forecast?latitude=-34.47&longitude=-58.63&current=temperature_2m&timezone=America%2FArgentina%2FBuenos_Aires').then(r=>r.json()).then(j=>{document.getElementById('clima').textContent='Tigre ahora: '+j.current.temperature_2m+'°C - Real'}).catch(()=>{document.getElementById('clima').textContent='Sin internet';});
</script>
</body>
    </html>
