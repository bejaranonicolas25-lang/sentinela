<script>
function cerebro(v){
var l=v.toLowerCase();
var total=0,rojos=0,amar=0;
try{total=datos.length;rojos=datos.filter(function(d){return d.nivel.indexOf('ROJO')>-1}).length;amar=datos.filter(function(d){return d.nivel.indexOf('AMARILLO')>-1}).length}catch(e){}
if(l.indexOf('reporte')>-1||l.indexOf('resumen')>-1)return '📄 REPORTE REAL '+new Date().toLocaleString()+': Tenés '+total+' publicaciones, '+rojos+' rojos, '+amar+' amarillos, '+panel.ok+'/'+panel.total+' cámaras. ALFA BRAVO 10-4.';
if(l.indexOf('lab')>-1)return '🧪 LAB REAL: Tenés '+total+' registros. El último fue: '+(datos[0]?datos[0].que+' - '+datos[0].nivel:'todavía no hay ninguno, andá a 🧪 Lab y guardá el primero.');
if(l.indexOf('camara')>-1||l.indexOf('cámara')>-1)return '📷 CÁMARAS REALES: Tenés '+panel.ok+'/'+panel.total+' andando. Para probar: andá a Inicio, tocá PRENDER CÁMARA REAL y dale permiso.';
if(l.indexOf('alfa bravo')>-1)return 'ALFA BRAVO 10-4, DIEZ CUATRO 😎 Todo en orden, jefe. ¿Qué querés que hagamos? Podés pedirme reporte, lab, códigos o chiste.';
if(l.indexOf('charlie')>-1)return 'CHARLIE = Chequeo. Si querés lo publico en tu muro, decime PUBLICAR CHARLIE.';
if(l.indexOf('delta')>-1)return 'DELTA = Salgo ya. Si querés lo publico, decime PUBLICAR DELTA.';
if(l.indexOf('golf')>-1)return 'GOLF = Guardia atento.';
if(l.indexOf('hotel')>-1||l.indexOf('base')>-1)return 'HOTEL + BASE = Estás en casa, en base. Zona segura.';
if(l.indexOf('publicar charlie')>-1){addPub('CHARLIE = Chequeo - '+new Date().toLocaleString(),'🟢 VERDE - Todo bien','Central','Código ALFA BRAVO');return '✅ CHARLIE publicado en tu muro real.'}
if(l.indexOf('publicar delta')>-1){addPub('DELTA = Salgo ya - '+new Date().toLocaleString(),'🟡 AMARILLO - Ojo','Central','Código ALFA BRAVO');return '✅ DELTA publicado en tu muro real.'}
if(l.indexOf('chiste')>-1)return 'Va un chorro, ve tu cartel de SENTINELA que dice ALFA BRAVO 10-4 y dice: Nooo, yo venía a robar tranquilo, no a dar un examen 😂';
if(l.indexOf('hola')>-1||l.indexOf('que onda')>-1||l.indexOf('qué onda')>-1)return 'Qué haces capo 😎 Acá estoy. Tenés '+total+' publicaciones reales. Decime: ¿reporte, lab, códigos o hablamos de todo?';
if(l.indexOf('que hago')>-1||l.indexOf('qué hago')>-1||l.indexOf('aburrido')>-1)return 'Hacé esto: 1) Publicá algo real, 2) Sacate una foto real, 3) Guardá algo en el Lab.';
if(l.indexOf('911')>-1||l.indexOf('peligro')>-1||l.indexOf('robo')>-1)return '🚨 Si hay peligro real, andá a Inicio y tocá LLAMAR 911 REAL.';
if(l.indexOf('quien sos')>-1||l.indexOf('quién sos')>-1)return 'Soy SENTINEL ACCORDED, tu IA de SENTINELA. Sé todo lo que guardaste en tu Lab, tu muro y tu panel.';
if(l.indexOf('te quiero')>-1||l.indexOf('capo')>-1)return 'Gracias jefe 😎 Vos sos el jefe, yo soy tu centinela. ALFA BRAVO 10-4 siempre.';
return 'Te escucho, jefe 👀 Vos me dijiste: "'+v+'". Si querés saber de tu Lab, decime LAB, si querés reporte decime REPORTE, si querés códigos decime ALFA BRAVO. '+new Date().toLocaleTimeString()+' - DIEZ CUATRO';
}
document.getElementById('bSend').onclick=function(){
var i=document.getElementById('inp');if(!i.value.trim())return;var v=i.value;i.value='';var m=document.getElementById('msgs');m.innerHTML+='<div class="b m">'+v+'</div>';m.scrollTop=m.scrollHeight;setTimeout(function(){m.innerHTML+='<div class="b">'+cerebro(v)+'</div>';m.scrollTop=m.scrollHeight},500)};
document.getElementById('inp').addEventListener('keydown',function(e){if(e.key=='Enter')document.getElementById('bSend').click()});
  </script>
