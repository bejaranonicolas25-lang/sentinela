<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINELA FINAL - IA CON CEREBRO</title>
<style>
*{box-sizing:border-box}body{background:#050508;color:#fff;font-family:Arial;margin:0;padding:10px}
.card{background:linear-gradient(180deg,#1e0038,#12001f);border:2px solid #a100f2;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 0 20px #a100f233}
h1,h2{text-align:center;color:#e6c8ff;margin:8px 0}
button{width:100%;padding:14px;border:0;border-radius:14px;background:#a100f2;color:#fff;font-weight:900;margin:6px 0;font-size:16px}
.btn2{background:#2a0a4a;border:1px solid #a100f2;text-align:left}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{padding:14px}
.rojo{background:#c00}.verde{background:#0a7a42}.gris{background:#333}.dorado{background:#b8860b}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid #a100f2;background:#1a0033;color:#fff;margin:6px 0;font-size:16px}
.pantalla{display:none}.pantalla.activa{display:block}
.cam{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cam div{background:#111;border:1px solid #a100f2;border-radius:12px;padding:8px;text-align:center}.cam img{width:100%;border-radius:8px;height:120px;object-fit:cover}
#msg{text-align:center;font-weight:900;margin:8px 0;min-height:20px}
.switch{display:flex;justify-content:space-between;align-items:center;background:#2a0a4a;padding:12px;border-radius:12px;margin:6px 0}
.switch
