<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CENTINELA — Sistema de Acceso y Módulos</title>
  <style>
    :root {
      --bg-deep: #040914;
      --bg-navy: #081428;
      --bg-card: rgba(11, 23, 45, 0.88);
      --bg-card-solid: #0d1b34;
      --bg-input: #081224;
      --border-subtle: rgba(148, 184, 235, 0.16);
      --border-strong: rgba(148, 184, 235, 0.28);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-blue: #1d5fd6;
      --accent-blue-hover: #256ef0;
      --accent-glow: rgba(37, 130, 255, 0.45);
      --shadow-heavy: 0 24px 60px rgba(0, 0, 0, 0.78);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      min-height: 100%;
      background-color: var(--bg-deep);
      color: var(--text-main);
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(circle at 50% 16%, rgba(19, 54, 112, 0.55) 0%, rgba(7, 18, 38, 0.88) 45%, rgba(2, 5, 12, 0.98) 100%);
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(120, 165, 230, 0.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(120, 165, 230, 0.045) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, transparent 42%, rgba(0, 0, 0, 0.72) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .view {
      display: none;
      position: relative;
      z-index: 1;
    }

    .view.active {
      display: block;
    }

    /* ==================== LOGIN VIEW ==================== */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 28px 16px 36px;
    }

    .hero-stage {
      position: relative;
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: -14px;
    }

    .android-art {
      width: 100%;
      max-width: 440px;
      height: auto;
      display: block;
      filter: drop-shadow(0 22px 36px rgba(0, 0, 0, 0.85));
      user-select: none;
    }
