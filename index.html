<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CENTINELA</title><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#020617;color:#fff}
/* FONDO CIBERNETICO */
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 50% 20%,#0a1a3a,#020617 60%,#000);overflow:hidden}
.bg:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(56,189,248,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.1) 1px,transparent 1px);background-size:36px 36px;animation:m 5s linear infinite}
@keyframes m{to{background-position:0 36px}}
.gig{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;z-index:2;animation:f 3s ease-in-out infinite}
@keyframes f{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-12px)}}
.gig .r{font-size:170px;filter:drop-shadow(0 0 30px #38bdf8);display:block}
.gig b{font-size:26px;letter-spacing:6px;background:#020617;border:2px solid #38bdf8;border-radius:14px;padding:10px 18px;display:inline-block;box-shadow:0 0 25px #38bdf8;margin-top:6px}
.gig small{display:block;color:#38bdf8;font-size:10px;letter-spacing:2px;margin-top:6px}
.ag{position:absolute;top:50%;transform:translateY(-50%);text-align:center;z-index:3;animation:f2 3s ease-in-out infinite}
.ag.l{left:8px}.ag.r{right:8px;animation-delay:.7s}
@keyframes f2{0%,100%{transform:translateY(-50%) translateY(0)}50%{transform:translateY(-50%) translateY(-10px)}}
.ag .r{font-size:78px;filter:drop-shadow(0 0 18px #38bdf8);display:block}
.ag b{font-size:10px;background:#020617;border:1px solid #38bdf8;border-radius:8px;padding:6px;display:inline-block;margin-top:4px}
/* CONTENIDO */
.wrap{position:relative;z-index:10;max-width:430px;margin:0 auto;padding:12px 14px 20px;min-height:100vh}
.top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:6px}
.bus{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 14px;margin:10px 0}
.bus input{background:transparent;border:none;outline:none;color:#fff;width:100%}
.wid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.w{background:rgba(11,30,58,.85);border:1px solid rgba(56,189,248,.4);border-radius:20px;padding:14px;box-shadow:0 12px 30px #000;min-height:110px}
.w.big{grid-column:span 2;background:linear-gradient(135deg,#0ea5e9,#1e3a8a);display:flex;justify-content:space-between;align-items:center}
.w small{color:#bfdbfe;font-size:11px;font-weight:700}
.w b{font-size:28px;display:block;margin-top:4px}
.w button{background:#fff;border:none;padding:7px 11px;border-radius:20px;font-weight:700;font-size:12px;margin-top:8px;cursor:pointer}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;text-align:center}
.app{cursor:pointer}
.ic{width:56px;height:56px;margin:0 auto;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 8px 20px #000}
.app span{font-size:11px;display:block;margin-top:5px;text-shadow:0 2px 6px #000}
.c1{background:#2563eb}.c2{background:#059669}.c3{background:#d97706}.c4{background:#7c3aed}.c5{background:#dc2626}.c6{background:#0891b2}.c7{background:#db2777}
.dock{position:sticky;bottom:10px;margin-top:18px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);border-radius:28px;padding:10px;display:flex;justify-content:space-around}
.dock .ic{width:50px;height:50px}
.login{position:relative;z-index:10;max-width:430px;margin:0 auto;min-height:100vh;padding:40px 20px;text-align:center}
input{width:100%;padding:13px;border-radius:13px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.55);color:#fff;margin-top:12px;outline:none}
button{width:100%;padding:13px;border:none;border-radius:13px;font-weight:700;margin-top:12px;cursor:pointer}
.btnw{background:#fff;color:#000}.btnd{background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.25)}
.modal{position:fixed;inset:0;background:#071426;z-index:99;display:none;flex-direction:column}
.modal.open{display:flex}
