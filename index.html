<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CENTINELA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#040d21;color:#fff}
.wrap{max-width:460px;margin:0 auto;padding:20px 14px 40px;text-align:center}
.card{background:#0a1a3a;border:1px solid #38bdf8;border-radius:16px;padding:18px;margin-top:14px;text-align:left}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #1e3a8a;background:#01040a;color:#fff;margin-top:10px}
button{width:100%;padding:14px;border:none;border-radius:10px;font-weight:800;margin-top:10px;cursor:pointer}
.blue{background:#2563eb;color:#fff}.dark{background:#020817;color:#fff;border:1px solid #1e3a8a}
.out{background:#01040a;border:1px solid #1e3a8a;border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;margin-top:10px}
.dash{max-width:600px;margin:0 auto;padding:16px 14px 40px}
.top{background:#07193d;border:1px solid #38bdf8;border-radius:12px;padding:12px;margin-bottom:12px;display:flex;justify-content:space-between}
.box{background:#0a1a3a;border:1px solid #1e3a8a;border-radius:14px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:#020817;border:1px solid #1e3a8a;border-radius:12px;padding:14px;text-align:center;cursor:pointer}
</style>
</head>
<body>

<!-- INICIO SIN HUMANOIDE -->
<div id="login" class="wrap">
<h1 style="font-size:48px;letter-spacing:6px">CENTINELA</h1>
<p style="color:#94a3b8;margin-top:6px">Nico Bejarano • ALFA BRAVO 10-4 • José León Suárez</p>
<div style="font-size:60px;margin:16px 0">🛡️</div>
<div class="card">
<h2 style="text-align:center">Bienvenido a CENTINELA</h2>
<input value="Nico Bejarano">
<input type="password" value="NICO-10-4-SENTINELA">
<!-- ESTE BOTON ENTRA DIRECTO, SIN FUNCION -->
<button class="blue" onclick="document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';window.scrollTo(0,0)">Iniciar sesión - TOCAME PARA ENTRAR</button>
<button class="dark" onclick="alert('Clave: NICO-10-4-SENTINELA')">¿Olvidaste tu contraseña?</button>
<button class="dark" onclick="document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block'">Modo offline - ENTRAR</button>
</div>
</div>

<!-- INTERIOR - ESTABA ESCONDIDO, AHORA SI APARECE -->
<div id="panel" class="dash" style="display:none">
<div class="top"><b>🛡️ CENTINELA • YA ENTRASTE ✅</b><button onclick="document.getElementById('panel').style.display='none';document.getElementById('login').style.display='block'" style="width:auto;padding:6px 12px;background:none;border:none;color:#38bdf8;font-weight:800;cursor:pointer">Salir</button></div>

<div class="box"><h3>🌤️ Clima real - Tigre</h3><p id="clima">Cargando...</p><button class="blue" onclick="clima()">🔄 Actualizar clima</button></div>

<div class="box"><h3>🔊 Voz real</h3><button class="blue" onclick="hablar('Alfa Bravo diez cuatro. Centinela activo. Nico Bejarano, sistema listo.')">▶️ ESCUCHAR: CENTINELA ACTIVO</button><button class="dark" onclick="try{speechSynthesis.cancel()}catch(e){}">⏹️ Parar voz</button><input id="vozTxt" value="Alfa Bravo 10-4, Centinela activo, Nico Bejarano"><button class="blue" onclick="hablar(document.getElementById('vozTxt').value)">🗣️ Decir mi texto</button></div>

<div class="box"><h3>📚 Traductor real</h3><input id="tradIn" placeholder="Escribí: amparo, taquicardia, penal, asado"><button class="blue" onclick="traducir()">TRADUCIR</button><div id="tradOut" class="out" style="display:none"></div></div>

<div class="box"><h3>🏭 Fábrica real</h3><button class="blue" onclick="generar()">GENERAR 10 ORACIONES</button><button class="dark" onclick="verGuardadas()">📋 Ver guardadas</button><button class="dark" onclick="descargar()">⬇️ Descargar .txt real</button><div id="genOut" class="out" style="display:none"></div></div>

<div class="box"><h3>💬 Diálogo real</h3><input id="t1" value="SALUDO"><input id="t2" value="PREGUNTA"><button class="blue" onclick="dialogo()">CREAR DIÁLOGO</button><div id="diaOut" class="out" style="display:none"></div></div>

<div class="box"><h3>✅ Corrector real</h3><input id="corIn" placeholder="Ej: {#☠️.} [Amparo + Taquicardia]"><button class="blue" onclick="corregir()">CORREGIR</button><div id="corOut" class="out" style="display:none"></div></div>

<div class="box"><h3>🛠️ 20 Herramientas reales</h3><input id="buscar" placeholder="Buscar... ej: dolar, clima, juego" oninput="filtrar()"><div class="grid" id="grid"></div></div>
</div>

<script>
function clima(){fetch('https://api.open-meteo.com/v1/forecast?latitude=-34.47&longitude=-58.63&current=temperature_2m,relative_humidity_2m,wind_speed_10m&timezone=America%2FArgentina%2FBuenos_Aires').then(r=>r.json()).then(j=>{document.getElementById('clima').textContent='Tigre ahora: '+j.current.temperature_2m+'°C • Humedad: '+j.current.relative_humidity_2m+'% • Viento: '+j.current.wind_speed_10m+' km/h'}).catch(()=>{document.getElementById('clima').textContent='Sin internet';});}
function hablar(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='es-AR';u.rate=0.92;speechSynthesis.speak(u);}catch(e){}}
var D={'amparo':'PELIGRO, NO VENGAN','cautelar':'QUEDARSE EN BASE','expediente':'JUNTA SECRETA','sentencia firme':'TODO BIEN, CERRADO','apelación':'CAMBIAR DE CÓDIGO','perito':'HAY ALGUIEN MIRANDO','testigo':'HAY INFILTRADO','fiscal':'NOS SIGUEN','defensor':'ES DE CONFIANZA','embargo':'SALIR, SIN NADA','habeas corpus':'SALIR YA','taquicardia':'PELIGRO TOTAL','hipertensión':'NOS VIGILAN','fiebre':'ZONA CALIENTE, NO VAYAS','penal':'EMERGENCIA, ACTUAR YA','asado':'JUNTA GRANDE','empanada':'PAQUETE SECRETO','mate':'HABLAR TRANQUI','gol':'LO LOGRAMOS','var':'REVISAR, ALGUIEN MIENTE','cancha':'BASE','contraseña':'CLAVE SECRETA, SOLO NICO','artigas':'NO NOS VEMOS, TRAMPA','lacroze':'PELIGRO, VENGAN','sarmiento':'BUSCAR ALGO IMPORTANTE'};
function show(id,txt){var e=document.getElementById(id);e.textContent=txt;e.style.display='block';}
function traducir(){var v=document.getElementById('tradIn').value.toLowerCase();var r=[];for(var k in D){if(v.indexOf(k)>-1)r.push(k+' = '+D[k]);}show('tradOut',r.length?r.join('\n'):'Probá: amparo, taquicardia, penal, asado');}
function crearO(){var k=Object.keys(D);var a=k[Math.floor(Math.random()*k.length)],b=k[Math.floor(Math.random()*k.length)],c=k[Math.floor(Math.random()*k.length)];return 'א {#☠️.} ['+a+' + '+b+' + '+c+'] ☠️ ...---... [Artigas 99999]\nREAL: '+D[a]+' + '+D[b]+' + '+D[c];}
function getG(){try{return JSON.parse(localStorage.getItem('centinela_oraciones')||'[]');}catch(e){return[];}}
function generar(){var g=getG();var t='';for(var i=0;i<10;i++){var o=crearO();g.push(o);t+=o+'\n\n';}try{localStorage.setItem('centinela_oraciones',JSON.stringify(g));}catch(e){}show('genOut',t+'TOTAL: '+g.length);}
function verGuardadas(){var g=getG();show('genOut',g.length?g.join('\n\n'):'Todavía no hay. Tocá GENERAR.');}
function descargar(){var g=getG();var blob=new Blob([g.join('\n\n')||'Sin oraciones'],{type:'text/plain'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='centinela.txt';a.click();}
var EJ={'SALUDO':'HOLA, EMPEZAMOS','PREGUNTA':'¿ALGUIEN MIENTE?','RESPUESTA':'SÍ, ALGUIEN MIENTE','PEDIDO':'NECESITO AYUDA','ORDEN':'CAMBIAR TODO YA','AVISO':'PELIGRO TOTAL','CHISTE':'CHISTE CENTINELA','DESPEDIDA':'TERMINÓ, LO LOGRAMOS'};
function dialogo(){var a=document.getElementById('t1').value.toUpperCase(),b=document.getElementById('t2').value.toUpperCase();show('diaOut','A - '+a+': '+(EJ[a]||a)+'\nB - '+b+': '+(EJ[b]||b));}
function corregir(){var v=document.getElementById('corIn').value;var e=[];if(v.indexOf('  ')>-1)e.push('Doble espacio');if(v.indexOf('א')===-1)e.push('Falta א al inicio');show('corOut',e.length?'ERRORES:\n- '+e.join('\n- '):'✅ CORRECTA:\n'+v);}
var T=[['🛡️','CENTINELA'],['🔐','VAULT'],['🧠','ACCORDED'],['🗣️','HABLA'],['☁️','CLOUD'],['📓','CHECKBOOK'],['⚙️','SETTINGS'],['📄','OFFICE'],['📤','SHARE'],['💻','CODE'],['🎓','ACADEMY'],['🎮','PLAY'],['📈','TRADER'],['📅','CALENDARIO'],['🧮','CALCULADORA'],['📷','CÁMARA'],['📍','UBICACIÓN'],['🔔','NOTIFICACIÓN'],['💾','GUARDAR'],['🗑️','BORRAR']];
var grid=document.getElementById('grid');
T.forEach(function(x){var d=document.createElement('div');d.className='tile';d.setAttribute('data-n',x[1].toLowerCase());d.innerHTML='<div>'+x[0]+'</div><b>'+x[1]+'</b>';d.onclick=function(){if(x[1]==='HABLA')hablar('Centinela Habla');else if(x[1]==='CLOUD')clima();else if(x[1]==='OFFICE')descargar();else if(x[1]==='TRADER'){fetch('https://dolarapi.com/v1/dolares/blue').then(r=>r.json()).then(j=>alert('Dólar Blue\nCompra: $'+j.compra+'\nVenta: $'+j.venta)).catch(()=>alert('Sin internet'));}else if(x[1]==='CALENDARIO')alert(new Date().toLocaleString('es-AR'));else if(x[1]==='CALCULADORA')alert('120 x 2 = 240');else if(x[1]==='PLAY'){var ks=Object.keys(D);var k=ks[Math.floor(Math.random()*ks.length)];var r=prompt('¿Qué significa: '+k+' ?');if(r!==null)alert(r.toLowerCase()===D[k].toLowerCase()?'✅ CORRECTO: '+D[k]:'❌ Era: '+D[k]);}else if(x[1]==='ACCORDED'){var q=prompt('Preguntale a ACCORDED (ej: amparo)');if(q)alert(D[q.toLowerCase()]||'No está');}else if(x[1]==='ACADEMY')alert('NIVEL 1: 1 mes - 1 palabra\nNIVEL 2: 3 meses - 2 palabras\nNIVEL 3: 6 meses - 3 palabras + Morse\nNIVEL 4: 1 año - Todo\nNIVEL 5: 2 AÑOS - Todo');else alert(x[1]+' activado');};grid.appendChild(d);});
function filtrar(){var q=document.getElementById('buscar').value.toLowerCase();document.querySelectorAll('.tile').forEach(function(el){el.style.display=el.getAttribute('data-n').indexOf(q)>-1?'block':'none';});}
clima();
</script>
</body>
</html>
