<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CENTINELA</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:20px}
.card{background:#111;border:1px solid #00ff88;border-radius:15px;padding:20px;margin:15px auto;max-width:450px}
input{width:90%;padding:12px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;margin:10px 0}
button{background:#00ff88;color:#000;border:none;padding:13px 20px;border-radius:10px;font-weight:bold;width:95%;margin-top:10px;cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>

<div id="login-screen" class="card">
<h1>🛡️ CENTINELA</h1>
<p>Tu escudo digital</p>
<input id="username" placeholder="Tu nombre">
<button onclick="entrar()">ENTRAR →</button>
<p id="msg"></p>
</div>

<div id="main-app" class="card hidden">
<h2>Bienvenido <span id="user-name"></span> 👋</h2>
<p>¿Qué querés revisar hoy?</p>
<button onclick="alert('SCANNER LISTO - Acá va el scanner')">🛡️ CENTINELA SCANNER</button>
<button onclick="salir()" style="background:#ff4444;color:#fff">SALIR</button>
<p id="status">✅ Login funcionando</p>
</div>

<script>
function entrar(){
  var n=document.getElementById('username').value.trim();
  if(!n){document.getElementById('msg').innerText='Poné tu nombre';return;}
  localStorage.setItem('centinela_user',n);
  mostrar(n);
}
function mostrar(n){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('main-app').classList.remove('hidden');
  document.getElementById('user-name').innerText=n;
}
function salir(){
  localStorage.removeItem('centinela_user');
  location.reload();
}
var guardado=localStorage.getItem('centinela_user');
if(guardado){mostrar(guardado);}
</script>
</body>
  </html>
