        /* Fondo azul marino profundo con sombreado negro radial y cuadrícula técnica */

        /* Viñeta negra periférica para profundidad cinematográfica */
        .vignette-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.82) 100%);
            z-index: 1;
        }

        /* Animación sutil de respiración del androide */
        @keyframes androidFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        .android-rig {
            animation: androidFloat 6s ease-in-out infinite;
        }

        /* Pulso suave en los ojos del androide */
        @keyframes eyePulse {
            0%, 100% { opacity: 0.92; filter: drop-shadow(0 0 8px #38bdf8) drop-shadow(0 0 18px #0284c7); }
            50% { opacity: 1; filter: drop-shadow(0 0 12px #7dd3fc) drop-shadow(0 0 26px #0ea5e9); }
        }

        .android-eyes {
            animation: eyePulse 3.5s ease-in-out infinite;
        }

        /* Estilo de vidrio oscuro ultra realista */
        .glass-panel {
            background: linear-gradient(165deg, rgba(18, 31, 54, 0.88) 0%, rgba(10, 18, 33, 0.94) 100%);

            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(96, 139, 204, 0.22);
            box-shadow:

                0 0 0 1px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px rgba(255, 255, 255, 0.12);
        }

        /* Inputs con profundidad interna */
        .realistic-input {
            background: rgba(16, 27, 48, 0.75);
            border: 1px solid rgba(71, 105, 158, 0.28);

            outline: none;
        }

        /* Botón principal con brillo metálico azul marino */

            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 55%, #1e3a8a 100%);
            border: 1px solid rgba(96, 165, 250, 0.35);
            box-shadow: 
                0 6px 20px -3px rgba(29, 78, 216, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.28);
            transition: all 0.2s ease;
        }

        .btn-centinela:hover {
            background: linear-gradient(180deg, #3b82f6 0%, #2563eb 55%, #1d4ed8 100%);
            box-shadow: 
                0 8px 25px -2px rgba(37, 99, 235, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.38);
            transform: translateY(-1px);
        }

        .btn-centinela:active {
            transform: translateY(1px);
        }

        /* Botón secundario Crear cuenta nueva */

            border-color: rgba(125, 165, 225, 0.45);
        }
