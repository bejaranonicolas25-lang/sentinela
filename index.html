<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CENTINELA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#040d21;color:#fff}
.hidden{display:none!important}
.wrap{max-width:460px;margin:0 auto;padding:16px 14px 40px;text-align:center}
.card{background:#0a1a3a;border:1px solid #38bdf8;border-radius:16px;padding:18px;margin-top:12px;text-align:left}
h1{font-size:42px;letter-spacing:5px}
.sub{color:#94a3b8;font-size:13px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #1e3a8a;background:#01040a;color:#fff;margin-top:10px}
button{width:100%;padding:13px;border:none;border-radius:10px;font-weight:800;margin-top:10px;cursor:pointer}
.blue{background:#2563eb;color:#fff}.dark{background:#020817;color:#fff;border:1px solid #1e3a8a}
.out{background:#01040a;border:1px solid #1e3a8a;border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;margin-top:10px;max-height:280px;overflow:auto}
.dash{max-width:600px;margin:0 auto;padding:16px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;background:#07193d;border:1px solid #38bdf8;border-radius:12px;padding:12px;margin-bottom:12px}
.box{background:#0a1a3a;border:1px solid #1e3a8a;border-radius:14px;padding:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:#020817;border:1px solid #1e3a8a;border-radius:12px;padding:14px;text-align:center;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal.open{display:flex}.modal .in{background:#081838;border:1px solid #38bdf8;border-radius:16px;padding:20px;width:100%;max-width:500px;max-height:85vh;overflow:auto}
#toast{position:fixed;bottom:20px;right:20px;background:#071530;border:1px solid #38bdf8;padding:12px 16px;border-radius:12px;z-index:100;display:none}
.hum{width:260px;height:350px;margin:6px auto 0;position:relative;animation:flota 3s ease-in-out infinite}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.cabeza{width:92px;height:105px;margin:0 auto;background:linear-gradient(180deg,#dbeafe,#93c5fd 40%,#1e3a8a);border:2px solid #bfdbfe;border-radius:48% 48% 42% 42%;position:relative;z-index:3}
.ojo{position:absolute;top:42px;width:16px;height:9px;background:#020617;border-radius:20px;box-shadow:0 0 12px #38bdf8}
.boca{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:28px;height:5px;background:#0f172a;border-radius:10px}
.cuello{width:26px;height:14px;background:#1e3a8a;margin:-2px auto 0}
.torso{width:132px;height:132px;margin:0 auto;background:linear-gradient(180deg,#1d4ed8,#0a1a3a);border:2px solid #60a5fa;border-radius:28px 28px 18px 18px;position:relative;z-index:2}
.pecho{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:56px;height:56px;background:radial-gradient(circle,#67e8f9,#0ea5e9 60%,#020617);border:2px solid #a5f3fc;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.brazo{position:absolute;top:145px;width:30px;height:95px;background:linear-gradient(180deg,#3b82f6,#071530);border:2px solid #93c5fd;border-radius:20px;z-index:1}
.brazo.izq{left:38px;transform:rotate(18deg)}.brazo.der{right:38px;transform:rotate(-18deg)}
.mano{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:34px;height:34px;background:#dbeafe;border:2px solid #60a5fa;border-radius:50%}
.pierna{position:absolute;bottom:0;width:38px;height:58px;background:linear-gradient(180deg,#1e3a8a,#020617);border:2px solid #60a5fa;border-radius:10px 10px 16px 16px}
.pierna.izq{left:72px}.pierna.der{right:72px}
.cartel{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:230px;background:#020617;border:2px solid #38bdf8;border-radius:12px;padding:10px 8px;z-index:4}
.cartel b{font-size:20px;letter-spacing:4px}.cartel small{display:block;color:#38bdf8;font-size:10px;margin-top:2px}
</style>
</head>
<body>
<div id="toast"></div>
<div id="login" class="wrap">
<h1>CENTINELA</h1><p class="sub">Nico Bejarano • ALFA BRAVO 10-4</p>
<div class="hum"><div class="cabeza"><div class="ojo" style="left:18px"></div><div class="ojo" style="right:18px"></div><div class="boca"></div></div><div class="cuello"></div><div class="torso"><div class="pecho">🛡️</div></div><div class="brazo izq"><div class="mano"></div></div><div class="brazo der"><div class="mano"></div></div><div class="pierna izq"></div><div class="pierna der"></div><div class="cartel"><b>CENTINELA</b><small>ALFA BRAVO 10-4 • NICO BEJARANO</small></div></div>
<div class="card">
<h2 style="text-align:center">Bienvenido a CENTINELA</h2>
<input id="user" value="Nico Bejarano">
<input id="pass" type="password" value="NICO-10-4-SENTINELA">
<button class="blue" onclick="entrarAhora()">Iniciar sesión - TOCAME PARA ENTRAR</button>
<button class="dark" onclick="verClave()">👁️ Ver contraseña</button>
<button class="dark" onclick="alert('Clave: NICO-10-4-SENTINELA')">¿Olvidaste tu contraseña?</button>
<button class="dark" onclick="entrarAhora()">Modo offline</button>
</div>
</div>
