<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CENTINELA - Pagá por lo que usás</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:white;margin:0;padding:20px;text-align:center}
h1{color:#38bdf8}
.card{background:#1e293b;border-radius:15px;padding:20px;margin:15px auto;max-width:400px}
button{background:#38bdf8;color:#000;border:none;padding:12px 20px;border-radius:10px;font-weight:bold;font-size:16px;margin:5px;width:100%}
button.green{background:#22c55e}
#saldo{font-size:32px;font-weight:bold;color:#22c55e}
input{width:90%;padding:12px;border-radius:10px;border:none;margin:10px 0;font-size:16px}
</style>
</head>
<body>
<h1>CENTINELA</h1>
<p>Pagá por lo que usás. Seguro. Sin mostrar tu info.</p>

<div class="card">
<h2>WALLET</h2>
<p>Saldo:</p>
<div id="saldo">0</div>
<p id="wallet-msg">Tu billetera está lista.</p>
<button onclick="depositar()">Depositar $1000</button>
<button class="green" onclick="enviarMercadoPago()">Enviar a Mercado Pago</button>
</div>

<div class="card">
<h2>SIMULADOR CENTINELA</h2>
<p>¿Cuánto querés gastar hoy?</p>
<input type="number" id="monto" placeholder="Ej: 5000">
<button onclick="pagar()">Pagar con Centinela</button>
<p id="pagar-msg"></p>
</div>

<script>
let saldo = 0;
function depositar(){
  saldo += 1000;
  document.getElementById('saldo').innerText = saldo;
  document.getElementById('wallet-msg').innerText = "Depósito adentro, seguro. Tu información no se mostró.";
}
function enviarMercadoPago(){
  if(saldo>0){
    document.getElementById('wallet-msg').innerText = "IA enviando $" + saldo + " a tu Mercado Pago vinculado... ¡Listo!";
    saldo=0;
    document.getElementById('saldo').innerText = saldo;
  } else {
    document.getElementById('wallet-msg').innerText = "No hay saldo para enviar.";
  }
}
function pagar(){
  let m = document.getElementById('monto').value;
  if(!m){ document.getElementById('pagar-msg').innerText = "Escribí un monto primero"; return; }
  if(saldo >= m){
    saldo -= m;
    document.getElementById('saldo').innerText = saldo;
    document.getElementById('pagar-msg').innerText = "Pago de $" + m + " hecho con Centinela. Nadie vio tus datos.";
  } else {
    document.getElementById('pagar-msg').innerText = "Te falta saldo. Depositá primero.";
  }
}
</script>
</body>
</html>
