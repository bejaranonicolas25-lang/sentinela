<!-- 🔒🔒🔒🔒🔒 SENTINELA LABORATORIO - QUÍNTUPLE CANDADO - SOLO NICO -->
<script>
(function(){
  // Si ya está adentro en esta sesión, no molesta de nuevo
  if(sessionStorage.getItem('lab_nico_ok')==='1') return;

  function guardar(dato){ try{localStorage.setItem('lab_nico_seg', JSON.stringify(dato));}catch(e){} }
  function leer(){ try{return JSON.parse(localStorage.getItem('lab_nico_seg')||'null');}catch(e){return null;} }

  var datos = leer();
  // Primera vez: CREAR USUARIO
  if(!datos){
    alert("🧪 LABORATORIO PRIVADO\n\nPrimera vez. Vamos a crear tu usuario de CREADOR, con toda la seguridad.");
    var usuario = prompt("PASO 1/4 - CREAR USUARIO\nElegí tu nombre de creador:");
    if(!usuario) return document.write("<h1 style='text-align:center;padding:40px;font-family:system-ui'>🚫 Cancelado</h1>");
    var clave = prompt("PASO 2/4 - CREAR CLAVE\nElegí una clave fuerte:");
    if(!clave) return document.write("<h1 style='text-align:center;padding:40px;font-family:system-ui'>🚫 Cancelado</h1>");
    var pregunta = prompt("PASO 3/4 - PREGUNTA DE SEGURIDAD\nEj: ¿Nombre de tu primera mascota?\nEscribí TU pregunta:");
    var respuesta = prompt("PASO 4/4 - RESPUESTA DE SEGURIDAD\nRespondé tu pregunta:");
    var codigoRecu = "NICO-" + Math.floor(1000+Math.random()*9000);
    guardar({usuario:usuario, clave:clave, pregunta:pregunta||"¿Tu clave?", respuesta:(respuesta||"").toLowerCase(), codigo:codigoRecu});
    alert("✅ USUARIO CREADO\n\nUsuario: "+usuario+"\n\n⚠️ GUARDÁ ESTE CÓDIGO DE RECUPERACIÓN EN UN PAPEL:\n"+codigoRecu+"\n\nSi te olvidás la clave, con este código entrás.");
    sessionStorage.setItem('lab_nico_ok','1');
    alert("Bienvenido Creador "+usuario+" 👨‍🔬");
    return;
  }

  // Ya existe usuario: PANTALLA DE ENTRADA
  var opcion = prompt("🧪 LABORATORIO PRIVADO - SOLO CREADOR\n\n1 = ENTRAR\n2 = OLVIDÉ MI CLAVE\n3 = SOY OTRA PERSONA / SALIR\n\nEscribí 1, 2 o 3:");
  
  if(opcion==="2"){
    // RECUPERAR
    var como = prompt("RECUPERAR CLAVE\n\n1 = Con Pregunta de Seguridad\n2 = Con Código de Recuperación\n\nEscribí 1 o 2:");
    if(como==="1"){
      var r = prompt("PREGUNTA DE SEGURIDAD:\n"+datos.pregunta);
      if(r && r.toLowerCase()===datos.respuesta){
        alert("✅ Correcto. Tu clave es: "+datos.clave);
        sessionStorage.setItem('lab_nico_ok','1');
        return;
      } else {
        document.write("<h1 style='text-align:center;padding:40px;font-family:system-ui'>🚫 Respuesta incorrecta</h1>");
        return;
      }
    }
    if(como==="2"){
      var c = prompt("Poné tu CÓDIGO DE RECUPERACIÓN (Ej: NICO-1234):");
      if(c && c.toUpperCase()===datos.codigo){
        var nueva = prompt("✅ Código correcto. Poné tu NUEVA clave:");
        datos.clave=nueva; guardar(datos);
        alert("Clave cambiada. Entrá con la nueva.");
        sessionStorage.setItem('lab_nico_ok','1');
        return;
      } else {
        document.write("<h1 style='text-align:center;padding:40px;font-family:system-ui'>🚫 Código incorrecto</h1>");
        return;
      }
    }
  }

  if(opcion!=="1"){
    document.write("<h1 style='text-align:center;padding:40px;font-family:system-ui'>🚫 Acceso denegado<br><span style='font-size:16px'>Laboratorio privado del creador.</span></h1>");
    return;
  }

  // CANDADO 1, 2, 3: Usuario + Clave + Confirmación
  var u = prompt("🔒 CANDADO 1/3 - USUARIO:");
  if(u!==datos.usuario){ document.write("<h1 style='text-align:center;padding:40px;font-family:system-ui'>🚫 Usuario incorrecto</h1>"); return; }
  var p = prompt("🔒 CANDADO 2/3 - CLAVE:");
  if(p!==datos.clave){ document.write("<h1 style='text-align:center;padding:40px;font-family:system-ui'>🚫 Clave incorrecta</h1>"); return; }
  var conf = confirm("🔒 CANDADO 3/3\n¿Sos vos, "+datos.usuario+", el creador de Sentinela?\n\nAceptar = Entrar\nCancelar = Salir");
  if(!conf){ document.write("<h1 style='text-align:center;padding:40px;font-family:system-ui'>🚫 Saliste del laboratorio</h1>"); return; }

  sessionStorage.setItem('lab_nico_ok','1');
  alert("✅ Bienvenido Creador "+datos.usuario+" 👨‍🔬\nLaboratorio desbloqueado.");
})();
</script>
<!-- FIN QUÍNTUPLE CANDADO -->
